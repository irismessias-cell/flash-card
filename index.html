<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Alura - Gatos Siameses</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <!-- Bloco do Cartao -->
        <article class="cartao" id="cartao-siames">
            <div class="cartao__conteudo">
                
                <!-- Face da Frente -->
                <div class="cartao__face cartao__face--frente">
                    <span class="cartao__tag">VERDADE OU MENTIRA?</span>
                    <h2 class="cartao__pergunta">Gatos siameses sempre nascem totalmente brancos.</h2>
                    <p class="cartao__dica">Clique no cartao para ver a resposta</p>
                </div>
                
                <!-- Face de Tras -->
                <div class="cartao__face cartao__face--tras">
                    <span class="cartao__tag cartao__tag--resposta">RESPOSTA</span>
                    <h2 class="cartao__resultado">E VERDADE!</h2>
                    <p class="cartao__explicacao">
                        Os filhotes nascem brancos devido ao calor do utero materno. As manchas escuras surgem nas partes mais frias do corpo (patas, orelhas e focinho) conforme eles crescem.
                    </p>
                </div>

            </div>
        </article>
    </main>

    <script src="app.js"></script>
</body>
</html>
